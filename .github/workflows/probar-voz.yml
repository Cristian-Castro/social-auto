name: probar-voz-clonada
on: workflow_dispatch
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/cache@v4
        with: {path: ~/.cache/huggingface, key: hf-chatterbox-v1}
      - name: Instalar (tarda unos minutos la primera vez)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install chatterbox-tts
      - name: Preparar tu grabación
        run: |
          f=$(ls voz/mi_voz.* | head -1)
          ffmpeg -y -loglevel error -i "$f" -ac 1 -ar 24000 -t 30 ref.wav
      - name: Clonar y hablar
        run: |
          python3 video/clonar_voz.py ref.wav "Hola, soy Cristian. Hoy te traigo tres trucos de inteligencia artificial que te van a ahorrar horas de trabajo cada semana. Guarda este video y pruébalos." prueba_voz.wav
      - uses: actions/upload-artifact@v4
        with: {name: prueba-voz, path: prueba_voz.wav}
