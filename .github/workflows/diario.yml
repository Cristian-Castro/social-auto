name: contenido-diario
on:
  schedule: [{cron: "0 12 * * *"}]   # 7:00 a.m. Colombia (UTC-5)
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar en Instagram y Facebook (dejar en false para solo probar)"
        default: "false"
jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
            ~/.cache/ms-playwright
          key: deps-v1
      - name: Instalar herramientas
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-inter jq
          pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install chatterbox-tts playwright edge-tts pillow anthropic pyyaml
          playwright install --with-deps chromium
      - name: Preparar tu voz de referencia
        run: |
          f=$(ls voz/mi_voz.* | head -1)
          ffmpeg -y -loglevel error -i "$f" -ac 1 -ar 24000 -t 30 ref.wav
      - name: 1) Guion del día con Claude
        run: python3 pipeline/generar_guion.py > guion.json
        env: {ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"}
      - name: 2) Voz (la tuya) y video
        run: |
          python3 video/tts.py guion.json guion_t.json audio.mp3
          python3 video/render_reel.py guion_t.json reel.mp4 audio.mp3
        env: {VOZ_REF: "ref.wav"}
      - uses: actions/upload-artifact@v4
        with: {name: reel, path: reel.mp4}
      - name: 3) Aprobación por Telegram
        run: python3 pipeline/aprobar_telegram.py reel.mp4 "$(jq -r .caption guion.json)"
        env: {TELEGRAM_TOKEN: "${{ secrets.TELEGRAM_TOKEN }}", TELEGRAM_CHAT_ID: "${{ secrets.TELEGRAM_CHAT_ID }}"}
      - name: 4) Publicar en Instagram y Facebook
        if: github.event_name == 'schedule' || github.event.inputs.publicar == 'true'
        run: echo "Pendiente - conectar Meta en el siguiente paso"
